# Example persona — voice.yaml
#
# Same structure as the shipped persona/voice.yaml. The shipped file is
# deliberately empty of `prefer` words, because voice must be derived from
# voice-samples.md, not asserted. The three samples in data/examples/
# correspond to this persona and give validate-persona.mjs something real to
# measure.

schema_version: 1

tone:
  adjectives: [direct, specific, calm, practical]
  secondary: [curious, occasionally blunt]
  never: [hypey, preachy, apologetic, salesy, guru-like]

point_of_view:
  person: second-first
  stance: practitioner
  certainty: calibrated

sentence:
  target_words: 14
  max_words: 26
  min_words: 4
  min_length_variance: 0.35

paragraph:
  max_lines: 2
  min_words: 12

vocabulary:
  prefer:
    - documented
    - handover
    - owns
    - runs
    - decision
    - surface
  avoid:
    - leverage
    - utilize
    - seamless
    - holistic
    - synergistic
    - robust solution
    - cutting-edge
    - game-changing
    - revolutionary
    - unlock the power
    - take it to the next level
    - in today's fast-paced world
    - in the ever-evolving landscape
    - at the end of the day
    - when it comes to
    - dive deep
    - deep dive
    - thought leader
    - passionate about
    - results-driven
    - value-add
    - touch base
    - circle back
    - low-hanging fruit

hedging:
  allow: [I have seen, in my experience, tends to, usually]
  disallow: [obviously, clearly, everyone knows, no brainer, guaranteed]

formatting:
  line_breaks_per_paragraph: 1
  max_emphasis_items: 2
  emphasis_style: plain
  emoji: false
  max_emoji_per_post: 0
  max_hashtags: 5
  min_hashtags: 3
  hashtag_placement: end
  hashtag_style: lower
  contractions: true
  profanity: none

banned_patterns:
  - '\bAI[- ]generated\b'
  - '\bas an AI\b'
  - '\bI generated\b'
  - '\bwithout further ado\b'
  - '\bBuckle up\b'
  - '\bLet that sink in\b'
  - '\bHere is the thing\b'
  - '\bnot just .+, but\b'
  - '\bit is not (just )?about\b'
  - '\bthe future of work is\b'
  - '\bwe are living in\b'
  - '\bnever be the same\b'
  - '\bparadigm shift\b'
  - '\bsynergise\b|\bsynergize\b'
  - '\bmindset shift\b'
  - '\bactionable insights\b'
  - '\bkey learnings\b'
  - '\bin conclusion\b'
  - '\bfurthermore\b'
  - '\bmoreover\b'
  - '\butilize\b|\butilise\b'

signature:
  enabled: false
  text: ""
  max_usage_rate: 0.30